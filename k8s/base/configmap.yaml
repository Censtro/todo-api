apiVersion: v1
kind: ConfigMap
metadata:
  name: todo-api-config
data:
  HTTP_ADDRESS: "0.0.0.0:5050"
  HTTP_SHUTDOWN_TIMEOUT: "30s"
  POSTGRES_HOST: "postgres"
  POSTGRES_PORT: "5432"
  POSTGRES_TIMEOUT: "30s"
  LOGGER_LEVEL: "DEBUG"
  LOGGER_FOLDER: "/app/out/logs"
  STATISTICS_CACHE_REDIS_ADDR: "redis:6379"
  STATISTICS_CACHE_REDIS_PASSWORD: ""
  STATISTICS_CACHE_REDIS_DB: "0"
  STATISTICS_CACHE_REDIS_TTL: "30s"
  TASK_EVENTS_BROKERS: "kafka:29092"
  TASK_EVENTS_TOPIC: "todo.task-events.v1"
  TASK_EVENTS_DEAD_LETTER_TOPIC: "todo.task-events.v1.dlq"
  TASK_EVENTS_CONSUMER_GROUP: "todo-task-audit-v1"
  TASK_EVENTS_POLL_INTERVAL: "500ms"
  TASK_EVENTS_LEASE_DURATION: "30s"
  TASK_EVENTS_BATCH_SIZE: "50"
