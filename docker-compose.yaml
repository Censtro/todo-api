services:

  todoapp:
    build:
      context: ${PROJECT_ROOT}
      dockerfile: ${PROJECT_ROOT}/cmd/todoapp/Dockerfile
    container_name: todoapp
    depends_on:
      - redis
    environment:
      - HTTP_ADDRESS=${HTTP_ADDRESS}
      - HTTP_SHUTDOWN_TIMEOUT=${HTTP_SHUTDOWN_TIMEOUT}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_TIMEOUT=${POSTGRES_TIMEOUT}
      - LOGGER_LEVEL=${LOGGER_LEVEL}
      - POSTGRES_HOST=todoapp-postgres 
      - LOGGER_FOLDER=/app/out/logs
      - STATISTICS_CACHE_REDIS_ADDR=redis:6379
      - STATISTICS_CACHE_REDIS_PASSWORD=${STATISTICS_CACHE_REDIS_PASSWORD:-}
      - STATISTICS_CACHE_REDIS_DB=${STATISTICS_CACHE_REDIS_DB:-0}
      - STATISTICS_CACHE_REDIS_TTL=${STATISTICS_CACHE_REDIS_TTL:-30s}
    volumes:
      - logs:/app/out/logs
    ports:
      - "5050:5050"
    restart: always
  
  redis:
    image: redis:7-alpine
    container_name: todoapp-redis
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  todoapp-postgres:
    image: postgres:17-bookworm
    container_name: todoapp-postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always

  migrate-postgres:
    image: migrate/migrate:v4.19.1
    volumes:
      - ${PROJECT_ROOT}/migrations:/migrations

  port-forwarder:
    image: alpine/socat:1.8.0.3
    container_name: todoapp-postgres-port-forwarder
    command: tcp-listen:5432,fork,reuseaddr tcp-connect:todoapp-postgres:5432
    ports:
      - "127.0.0.1:5432:5432"

  swagger:
    build:
      context: ${PROJECT_ROOT}
      dockerfile_inline: |
        FROM golang:1.25.6-alpine
        RUN apk add --no-cache git
        RUN go install github.com/swaggo/swag/cmd/swag@v1.16.6
        WORKDIR /code
        ENTRYPOINT ["swag"]
    volumes:
      - ${PROJECT_ROOT}:/code

volumes:
  pgdata:
  logs: