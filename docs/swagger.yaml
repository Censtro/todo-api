paths:
  /statistics:
    get:
      description: Get statistics for tasks created and completed in a specified date
        range. If user_id is not provided, returns statistics for all users.
      parameters:
      - description: User ID to get statistics for (optional, returns all users if
          omitted)
        in: query
        name: user_id
        type: integer
      - description: Start date in ISO 8601 format (YYYY-MM-DD)
        in: query
        name: from
        type: string
      - description: End date in ISO 8601 format (YYYY-MM-DD)
        in: query
        name: to
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Statistics retrieved successfully
          schema:
            $ref: '#/definitions/internal_features_statistics_transport_http.GetStatisticsResponse'
        "400":
          description: Bad Request - invalid query parameters
          schema:
            $ref: '#/definitions/github_com_Censtro_todo-api_internal_core_transport_http_response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_Censtro_todo-api_internal_core_transport_http_response.ErrorResponse'
      summary: Get task statistics
      tags:
      - statistics
  /tasks:
    get:
      description: List all tasks with optional pagination
      parameters:
