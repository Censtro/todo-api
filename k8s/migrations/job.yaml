apiVersion: batch/v1
kind: Job
metadata:
  name: task-events-migration
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: migrate/migrate:v4.19.1
          args:
            - "-path"
            - /migrations
            - "-database"
            - "postgres://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/$(POSTGRES_DB)?sslmode=disable"
            - up
          envFrom:
            - secretRef:
                name: todo-secrets
          volumeMounts:
            - name: migrations
              mountPath: /migrations
              readOnly: true
      volumes:
        - name: migrations
          configMap:
            name: todo-migrations
